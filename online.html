<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POIFOOTB Online — Salas</title><style>body{background:#101d27;color:#f6f8fa;font:16px system-ui;margin:0;padding:32px}main{max-width:660px;margin:auto}.card{background:#1b303d;border:1px solid #365260;border-radius:16px;padding:20px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #6b8997}input{background:#0d202b;color:white;max-width:90%}button{background:#34c989;color:#09251a;cursor:pointer;font-weight:700}button:disabled{opacity:.5}#status{white-space:pre-wrap}a{color:#6ce5b1}</style></head><body><main><h1>⚽ POIFOOTB Online</h1><p>Salas online de teste — o jogo de carreira ainda não está sincronizado.</p><div class="card"><h2>Criar sala</h2><input id="nome" maxlength="40" placeholder="Seu nome" value="Treinador"><p><button id="criar" disabled>Criar sala</button></p></div><div class="card"><h2>Entrar em uma sala</h2><input id="codigo" maxlength="12" placeholder="Código da sala"><p><button id="entrar" disabled>Entrar</button></p></div><div class="card"><h2>Sala</h2><p id="status">Conectando ao Firebase…</p><div id="membros"></div></div><a href="index.html">Voltar ao POIFOOTB</a></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,set,get,onValue,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);let uid=null,unsubscribe=null;
const status=t=>$('status').textContent=t;
const name=()=>($('nome').value.trim().slice(0,40)||'Treinador');
const code=()=>Math.random().toString(36).slice(2,8).toUpperCase();
function watch(id){if(unsubscribe)unsubscribe();unsubscribe=onValue(ref(db,'salas/'+id),snap=>{const data=snap.val();if(!data){status('Sala não encontrada.');return}status('Código: '+id+'\nStatus: '+(data.status||'aguardando')+'\nCriador: '+(data.criador===uid?'você':'outro treinador'));$('membros').textContent='Participantes: '+Object.values(data.jogadores||{}).map(p=>p.nome||'Treinador').join(', ')},e=>status('Erro de permissão: '+e.message))}
onAuthStateChanged(auth,user=>{uid=user?.uid||null;$('criar').disabled=!uid;$('entrar').disabled=!uid;if(uid)status('Conectado. Crie ou entre em uma sala.')});
signInAnonymously(auth).catch(e=>status('Ative Authentication > Anônimo no Firebase. '+e.message));
$('criar').onclick=async()=>{try{const id=code();await set(ref(db,'salas/'+id),{nome:'Carreira online',criador:uid,status:'aguardando',ano:2026,rodada:1,turnoAtual:uid,jogadores:{[uid]:{nome:name(),clube:'',pronto:false}}});$('codigo').value=id;watch(id)}catch(e){status('Não foi possível criar sala: '+e.message)}};
$('entrar').onclick=async()=>{const id=$('codigo').value.trim().toUpperCase();if(!/^[A-Z0-9]{6,12}$/.test(id)){status('Digite um código de 6 a 12 caracteres.');return}try{const snap=await get(ref(db,'salas/'+id+'/status'));if(!snap.exists()){status('Sala não encontrada.');return}await set(ref(db,'salas/'+id+'/jogadores/'+uid),{nome:name(),clube:'',pronto:false});watch(id)}catch(e){status('Não foi possível entrar: '+e.message)}};
</script></body></html>
